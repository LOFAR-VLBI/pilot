[project]
name = "PILOT"
description = "PILOT: the VLBI Pipeline for the International LOFAR Telescope"
version = "1.1.0"
requires-python = ">3.10"
dependencies = [
    "astropy",
    "bdsf",
    "python-casacore",
    "LINC @ git+https://git.astron.nl/RD/LINC",
    "lofar_facet_selfcal @ git+https://github.com/rvweeren/lofar_facet_selfcal",
    "lofar_helpers @ git+https://github.com/jurjen93/lofar_helpers",
    "lofar-vlbi-plot",
    "losoto",
    "numpy",
    "pandas",
    "psutil",
    "joblib",
    "numba",
    "tables",
    "tox",
]

[project.optional-dependencies]
"test" = [
    "cwltool",
    "pytest",
]

[tool.setuptools]
packages = []

[tool.tox]
requires = ["tox>=4.22"]
envlist = ["py311", "py312", "py313"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
change_dir = "{tox_root}/tests"
description = "Run tests under {base_python}"
extras = ["test"]
allowlist_externals = ["sh", "pytest"]
commands = [
    [ "sh", "prepare_data.sh" ],
    [ "sh", "validate_steps.sh", {replace = "posargs", extend = true} ],
    [ "sh", "validate_workflows.sh", {replace = "posargs", extend = true} ],
    [ "pytest" ],
]

[tool.tox.env_run_base.setenv]
TEST_HBA_DATASET_NAME = "test_data.tar.gz"
TARGET_HBA_RESULTS_NAME = "results_target.tar.gz"
PIP_CACHE_DIR = "{tox_root}/.cache/pip"
VLBI_ROOT_DIR = "{tox_root}"
PYTHONPATH = "$PYTHONPATH:{tox_root}/scripts"
